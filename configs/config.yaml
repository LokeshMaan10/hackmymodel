# =====================================================================
# Hack My Own Model — main project config
# All paths are relative to the project root.
# Every "assumption" here is reported in the final README so results
# can be traced back to the numbers that produced them.
# =====================================================================

project:
  name: hack-my-own-model
  seeds: [42, 7, 123, 2024, 31337]   # used for seed-variation runs (Module 12)
  default_seed: 42

paths:
  raw_dir: data/raw                  # put Kaggle CSVs here (never committed)
  interim_dir: data/interim          # cleaned / downcast parquet
  processed_dir: data/processed      # feature matrices + splits
  models_dir: models                 # trained model files (gitignored)
  results_dir: results               # small precomputed artifacts for the app
  figures_dir: reports/figures
  mlflow_uri: mlruns                 # local MLflow tracking folder

data:
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  target: isFraud
  id_col: TransactionID
  time_col: TransactionDT            # seconds from an unknown reference point
  amount_col: TransactionAmt
  # Low-RAM mode: load only a fraction of rows (1.0 = all). 16 GB RAM handles 1.0.
  sample_frac: 1.0

split:
  # Time-based split on day = TransactionDT // 86400 (data spans ~183 days).
  # Train on the past, tune on the next month, test on the last month.
  train_end_day: 120                 # train:      day <  120
  val_end_day: 150                   # validation: 120 <= day < 150
                                     # test:       day >= 150

business:
  usd_to_inr: 84.0                   # ASSUMPTION: fixed conversion rate
  false_positive_cost_inr: 250.0     # ASSUMPTION: analyst review + customer friction per false alarm
  # A missed fraud costs its full amount (converted to INR).

attack:
  n_targets: 500                     # detected test frauds to attack (per seed)
  query_budget: 2000                 # max model queries per transaction
  cost_budget: 60.0                  # max attacker change-cost (abstract units)
  min_amount_ratio: 0.5              # attacker must still steal >= 50% of original amount
  min_amount_inr: 500.0              # ...and at least this much in absolute terms
  lambda_cost: 1.0                   # weight of change-cost in the attacker's gain

mlflow:
  experiment_name: hack-my-own-model
